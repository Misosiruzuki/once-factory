name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Find jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | grep -v javadoc | head -n1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          body: |
            ## Once Factory ${{ github.ref_name }}

            Minecraft **1.20.1** / Forge **47.4.10**

            ### Install
            1. Install Forge 1.20.1
            2. Put the jar into the `mods` folder

            ### Notes
            - Early vertical slice (v0.x)
            - Machines have finite life while processing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
